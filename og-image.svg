<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#111a30"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Accent Top Border -->
  <rect width="1200" height="8" fill="url(#cyanGrad)"/>

  <!-- Decorative Glow Circles -->
  <circle cx="1050" cy="150" r="280" fill="#00f2fe" opacity="0.06" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="240" fill="#7928ca" opacity="0.08" filter="blur(50px)"/>

  <!-- Main Card Container -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="2"/>

  <!-- Brand Header -->
  <g transform="translate(110, 150)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="url(#cyanGrad)" letter-spacing="1">
      ⚡ ANTIGRAVITY TOOLS
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(110, 240)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="36" fill="#ffffff">
      50+ High-Demand AI, Webmaster &amp; Developer Tools
    </text>
  </g>

  <g transform="translate(110, 300)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
      100% Client-Side • Zero Server Logs • Instant Browser Speed • 100% Free
    </text>
  </g>

  <!-- Badges / Tags Grid -->
  <g transform="translate(110, 370)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#00f2fe" text-anchor="middle">🤖 AI &amp; Prompting</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="350" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#38bdf8" text-anchor="middle">🛡️ SEO &amp; Trust</text>

    <!-- Badge 3 -->
    <rect x="480" y="0" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="590" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#a855f7" text-anchor="middle">🔐 Security &amp; Auth</text>

    <!-- Badge 4 -->
    <rect x="720" y="0" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="830" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#ec4899" text-anchor="middle">🎨 CSS &amp; Design</text>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(110, 490)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="url(#cyanGrad)" opacity="0.15"/>
    <rect x="0" y="0" width="460" height="42" rx="21" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="230" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#00f2fe" text-anchor="middle">
      🛡️ 100% PRIVACY-FIRST LOCAL BROWSER ENGINE
    </text>
  </g>
</svg>
