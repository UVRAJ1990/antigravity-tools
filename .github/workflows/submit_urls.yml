name: Daily URL Submitter

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  submit-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install rsa

      - name: Run URL submitter
        env:
          SC_CREDENTIALS: ${{ secrets.SC_CREDENTIALS }}
          PYTHONIOENCODING: utf-8
        run: python submit_urls.py

      - name: Save submission log back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submission_log.json
          git diff --cached --quiet || git commit -m "chore: update submission_log [$(date -u '+%Y-%m-%d')]"
          git push
